version: "3.8"

services:

  backend:
    image: ${DOCKERHUB_USERNAME}/chatbot-backend:latest
    container_name: chatbot-backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5000:5000"

    depends_on:
      - chromadb

    networks:
      - chatbot-network


  chatbot:
    image: ${DOCKERHUB_USERNAME}/chatbot-frontend:latest
    container_name: chatbot-frontend
    restart: unless-stopped

    ports:
      - "8501:8501"

    depends_on:
      - backend

    networks:
      - chatbot-network


  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - chroma_data:/chroma/chroma

    networks:
      - chatbot-network


networks:
  chatbot-network:
    driver: bridge


volumes:
  chroma_data:
