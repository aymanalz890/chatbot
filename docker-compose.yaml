services:
  chromadb:
    image: chromadb/chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    ports:
      - "5000:5000"
    depends_on:
      - chromadb
    volumes:
      - ./chat_logs:/app/chat_logs
      - ./pdf_store:/app/pdf_store

  chatbot:
    build:
      context: .
      dockerfile: Dockerfile.chatbot
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  chromadb_data: